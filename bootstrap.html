<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Profile Cards</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <h1 class="text-center mb-4">My Profile Cards</h1>

        <div class="row g-4">

            <!-- Card 1 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card p-3 h-100 shadow-sm">

                    <span class="badge bg-success position-absolute top-0 end-0 m-2">
                        ONLINE
                    </span>

                    <div class="d-flex align-items-center gap-3">
                        <img src="https://via.placeholder.com/70"
                             class="rounded-circle"
                             width="70"
                             height="70"
                             alt="John">

                        <div>
                            <h2 class="h5 mb-1">John Doe</h2>
                            <p class="text-muted mb-0">Web Developer</p>
                        </div>
                    </div>

                    <p class="mt-3">
                        I love creating websites and learning new technologies.
                    </p>

                </div>
            </div>

            <!-- Card 2 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card p-3 h-100 shadow-sm">

                    <span class="badge bg-primary position-absolute top-0 end-0 m-2">
                        NEW
                    </span>

                    <div class="d-flex align-items-center gap-3">
                        <img src="https://via.placeholder.com/70"
                             class="rounded-circle"
                             width="70"
                             height="70"
                             alt="Sarah">

                        <div>
                            <h2 class="h5 mb-1">Sarah</h2>
                            <p class="text-muted mb-0">Designer</p>
                        </div>
                    </div>

                    <p class="mt-3">
                        I enjoy designing simple and beautiful websites.
                    </p>

                </div>
            </div>

            <!-- Card 3 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card p-3 h-100 shadow-sm">

                    <span class="badge bg-success position-absolute top-0 end-0 m-2">
                        ONLINE
                    </span>

                    <div class="d-flex align-items-center gap-3">
                        <img src="https://via.placeholder.com/70"
                             class="rounded-circle"
                             width="70"
                             height="70"
                             alt="Mike">

                        <div>
                            <h2 class="h5 mb-1">Mike</h2>
                            <p class="text-muted mb-0">Programmer</p>
                        </div>
                    </div>

                    <p class="mt-3">
                        I enjoy programming and building useful applications.
                    </p>

                </div>
            </div>

        </div>

    </div>

</body>
</html>
