<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards</title>

    <style>
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        
        .card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;       /* Box Model */
            margin: 10px;        /* Box Model */
            position: relative; /* Required for badge */
        }

        
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: green;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }

        /* Flexbox */
        .profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
        }

        .profile h2 {
            margin: 0;
        }

        .profile p {
            margin: 5px 0;
            color: gray;
        }

        
        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Profile Cards</h1>

    <div class="container">

        <div class="card">
            <span class="badge">ONLINE</span>

            <div class="profile">
                <img src="https://via.placeholder.com/70" alt="Profile">
                <div>
                    <h2>John Doe</h2>
                    <p>Web Developer</p>
                </div>
            </div>

            <p>I love creating websites and learning new technologies.</p>
        </div>

        <div class="card">
            <span class="badge">NEW</span>

            <div class="profile">
                <img src="https://via.placeholder.com/70" alt="Profile">
                <div>
                    <h2>Sarah</h2>
                    <p>Designer</p>
                </div>
            </div>

            <p>I enjoy designing simple and beautiful websites.</p>
        </div>

        <div class="card">
            <span class="badge">ONLINE</span>

            <div class="profile">
                <img src="https://via.placeholder.com/70" alt="Profile">
                <div>
                    <h2>Mike</h2>
                    <p>Programmer</p>
                </div>
            </div>

            <p>I enjoy programming and building useful applications.</p>
        </div>

    </div>

</body>
</html>
